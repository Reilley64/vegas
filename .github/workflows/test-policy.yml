name: "Test: Pull request policy"

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  test-policy:
    name: "Test: Pull request policy"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "Policy: Enforce a conventional commit title"
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            style
            test
            build
            ci
            chore
            revert
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Source: Check out the pull request"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: "Setup: Install Go"
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6; public upstream revision, gitleaks:allow
        with:
          go-version: "1.27.2"
          cache: false

      - name: "Setup: Build the policy range scanner"
        working-directory: tools/public-check-batch
        run: go build -trimpath -o "$RUNNER_TEMP/public-check-batch" .

      - name: "Setup: Install gitleaks"
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/

      # The local hooks are the gate; this catches content committed without them.
      - name: "Policy: Keep personal and private details out"
        env:
          PUBLIC_ALLOW_EMAILS: ${{ vars.ALLOWED_AUTHOR_EMAILS }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          "$RUNNER_TEMP/public-check-batch" --patterns tools/hooks/public-patterns.txt range "$BASE_SHA..$HEAD_SHA"
          printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | tools/hooks/public-check text
