name: "Build: windows-x64"

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-windows-x64-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    name: "Build: windows-x64"
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: "Source: Check out the repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # FFmpeg's configure script and make run under MSYS2.
      - name: "Setup: Install MSYS2 with make"
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MSYS
          install: make diffutils

      # Puts the Windows SDK, lib.exe, dumpbin.exe and Ninja on PATH for clang-cl and FFmpeg.
      - name: "Setup: Load the Visual Studio x64 environment"
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: "Build: Configure the windows-x64 preset"
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: cmake --preset windows-x64 "-DMSYS2_ROOT=$env:MSYS2_ROOT"

      # Ninja keeps going after a failed target, so every target that can be built is built.
      # The step still fails when any target fails.
      - name: "Build: Build the windows-x64 preset"
        id: build
        shell: pwsh
        run: cmake --build --preset windows-x64 -- -k 0

      # Runs after a failed build as well. CTest reports a test whose executable was not built
      # as Not Run or Failed and exits non-zero, so a missing test is never counted as passed.
      # Each test gets five minutes, so a hang cannot use up the job's time limit.
      - name: "Test: Run the file-format suite"
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        run: ctest --preset windows-x64 --timeout 300
